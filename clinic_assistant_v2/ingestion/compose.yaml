
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - clinic_net

  ingest:
    build:
      context: ..
      dockerfile: ingestion/Dockerfile
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant
    networks:
      - clinic_net
    restart: "no"

volumes:
  qdrant_storage:

networks:
  clinic_net:
    name: clinic_net
