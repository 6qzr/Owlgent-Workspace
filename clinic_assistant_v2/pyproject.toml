
[project]
name = "clinic-assistant-v2"
version = "0.1.0"
description = "Clinic Assistant v2 (#314): FastMCP servers, Qdrant RAG, Google OAuth and JWT."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "fastmcp>=4.2.5",
    "httpx>=0.28.1",
    "langgraph>=1.2.24",
    "openai>=3.58.0",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F",
    "I",
    "B",
    "S",
    "UP",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["."]
exclude = ["\\.venv/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
