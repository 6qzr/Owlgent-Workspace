[project]
name = "clinic-assistant-v2"
version = "0.1.0"
description = "Clinic Assistant v2 (#314): FastMCP servers, Qdrant RAG, Google OAuth and JWT."
requires-python = ">=3.14"
dependencies = [
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle errors/warnings, pyflakes
    "I",            # import order
    "B",            # bugbear: likely bugs
    "S",            # bandit security: hardcoded secrets, missing timeouts
    "UP",           # modern Python syntax
    "SIM",          # simplifications
]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare assert; test secrets are fake values made for the tests.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
# Every folder is a package from this root (e.g. servers.records.tokens), so the
# per-server copies of tokens.py never clash.
explicit_package_bases = true
files = ["."]
exclude = ["\\.venv/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
