[project]
name = "clinic-assistant"
version = "0.1.0"
description = "Clinic Front-Desk Assistant: a REST API driven by LangGraph workflows."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"

dependencies = [
    "fastmcp>=4.2.5",
    "openai>=3.58.0",
    "pyjwt>=2.15.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "starlette>=1.10.0",
]


[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "python-dotenv>=1.2.4",
    "pytest-asyncio>=1.4.1.post1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinic_assistant"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle errors/warnings, pyflakes (unused names, undefined vars)
    "I",            # import order
    "B",            # bugbear: likely bugs (mutable defaults, bare except...)
    "S",            # bandit security: hardcoded secrets, SQL built with strings, no timeouts
    "UP",           # pyupgrade: modern Python 3.14 syntax
    "SIM",          # simplifications
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest uses bare assert

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests"]
exclude = ["experiments/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"  # async def tests run without a decorator (ADR 0007)
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=clinic_assistant --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: needs a running PostgreSQL (DATABASE_URL)",
]
