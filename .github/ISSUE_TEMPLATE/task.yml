name: Task
description: A 1-3 hour piece of a story, owned by one person.
title: "T-XX: "
labels: ["task"]
body:
  - type: input
    id: story
    attributes:
      label: Parent story
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What to do
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: Estimate (hours)
      options: ["1", "2", "3"]
    validations:
      required: true
  - type: input
    id: depends
    attributes:
      label: Depends on
      placeholder: "#5, #7 or none"
