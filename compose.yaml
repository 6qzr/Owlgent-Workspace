# One command starts the whole system:  docker compose up -d --build

name: clinic-assistant

services:

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      # Services reach each other by service name (`db`), never localhost or an IP.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        # Wait until PostgreSQL answers pg_isready, not merely until its container starts.
        condition: service_healthy
    ports:
      # Only the API is published. The container always listens on 8000.
      - "${API_PORT}:8000"
    restart: unless-stopped

  db:
    image: postgres:17.6
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Every *.sql in db/ runs in name order on the FIRST start (empty volume).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No published port: services talk by name (`db`). For local tests use compose.dev.yaml.

volumes:
  pgdata:
