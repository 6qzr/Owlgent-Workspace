# One command starts the whole system:  docker compose up -d --build
# First version: PostgreSQL only. The `api` service (built from ./Dockerfile,
# depends_on db: service_healthy, publishes ${API_PORT}) is added by the Ops story.

name: clinic-assistant

services:
  db:
    image: postgres:17.6
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Every *.sql in db/ runs in name order on the FIRST start (empty volume).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No published port: services talk by name (`db`). For local tests use compose.dev.yaml.

volumes:
  pgdata:
